[package]
name = "pass_vault"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nanoid = "0.4"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5.3"
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["std"] }
thiserror = "1.0"
ratatui = { version = "0.28.0", features = ["all-widgets"] }
color-eyre = "0.6.3"
crossterm = "0.28.1"
